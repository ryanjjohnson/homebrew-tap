name: update

# Normally not needed: rndr's release workflow updates the formula itself, using
# a deploy key for this repository. This is the manual way to do the same thing,
# for re-pointing the formula at a particular release or recovering if that failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to use, such as v0.1.5 (default is the latest)
        required: false

permissions:
  contents: write # commit the regenerated formula
  actions: write # start the install tests for that commit

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the formula from the latest release (provenance checked)
        env:
          TAG: ${{ inputs.tag }}
        run: ./update.sh ${TAG:+"$TAG"}
      - name: Commit it if it changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          version=$(sed -n 's|.*/download/v\([0-9.]*\)/.*|\1|p' Formula/rndr.rb | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "rndr $version"
          git push
          # a push made with the workflow's own token does not start other workflows
          gh workflow run tests.yml --ref main
